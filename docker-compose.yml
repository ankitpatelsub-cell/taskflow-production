version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost
      # ⚠️  Change these secrets before deploying!
      - JWT_SECRET=${JWT_SECRET:-change_this_jwt_secret_32chars_min}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_this_refresh_secret_32chars}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-change_this_backup_key_32chars__}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - taskflow-data:/app/data
      - taskflow-uploads:/app/uploads
    ports:
      - "3001:3001"   # Remove in prod (use nginx proxy only)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  taskflow-data:    # Persists SQLite database + backups
  taskflow-uploads: # Persists task file attachments
